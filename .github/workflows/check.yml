name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  generated-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/generate.mjs --check
      - run: bash -n install.sh
      - run: for script in scripts/*.mjs; do node --check "$script"; done
      - run: node --test scripts/transcript.test.mjs
